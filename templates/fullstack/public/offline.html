<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6f8;
        color: #243040;
        font-family: -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
      }
      main {
        width: min(440px, calc(100% - 32px));
        padding: 24px;
        background: #fff;
        border: 1px solid #e4e7ec;
        border-radius: 14px;
      }
      h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; }
      p { margin: 0; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The app shell is cached. Saved API data is shown when the app can open. Writes stay disabled until the network returns.</p>
    </main>
  </body>
</html>
