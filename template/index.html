<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      var saved = null;
      var dark = false;
      var theme = 'light';
      try {
        try {
          saved = localStorage.getItem('theme');
        } catch (_error) {}
        dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        theme =
          saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="Riot.js application" />
    <meta name="theme-color" content="#5181b8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="RiotJS App" />
    <title>RiotJS App</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
