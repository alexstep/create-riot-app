# Typecheck, build the template, and smoke-test the packed CLI.
# Visual regression stays out of CI.

name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install, lint, typecheck, and build
        run: |
          set -euo pipefail
          bun install
          bun install --cwd template
          bun run lint
          bun run format:check
          bun run --cwd template typecheck
          bun run --cwd template build

      - name: Smoke-test the packed CLI
        run: |
          set -euo pipefail
          npm pack
          tarball="$(ls create-riot-app-*.tgz)"
          echo "Packed ${tarball} ($(wc -c < "${tarball}") bytes)"
          # Read the listing once. `tar | grep -q` under pipefail dies with
          # SIGPIPE when grep exits as soon as it finds a match.
          list="$(tar -tzf "${tarball}")"
          printf '%s\n' "${list}"
          if grep -E '(^|/)node_modules/|(^|/)dist/' <<< "${list}"; then
            echo "::error::tarball contains node_modules or dist"
            exit 1
          fi
          grep -q 'template/gitignore' <<< "${list}"
          for required in \
            template/biome.json \
            template/scripts/biome-riot.ts \
            template/.vscode/settings.json \
            template/.vscode/extensions.json \
            template/.vscode/tasks.json
          do
            if ! grep -q "${required}" <<< "${list}"; then
              echo "::error::tarball is missing ${required}"
              exit 1
            fi
          done
          if grep -q 'template/\.gitignore' <<< "${list}"; then
            echo "::error::ship template/gitignore; npm strips template/.gitignore"
            exit 1
          fi
          work="$(mktemp -d)"
          bunx --package "${PWD}/${tarball}" create-riot-app "${work}/my-app"
          test -f "${work}/my-app/.gitignore"
          test ! -e "${work}/my-app/gitignore"
          grep -q '"name": "my-app"' "${work}/my-app/package.json"
          cd "${work}/my-app"
          bun install
          bun run lint
          bun run format:check
          bun run build
          bun run typecheck
